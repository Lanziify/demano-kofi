services:
  db:
    image: postgres:16
    container_name: demano-kofi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:latest
    container_name: demano-kofi-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: demano-kofi-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio  http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/demano-kofi-local;
      /usr/bin/mc anonymous set download myminio/demano-kofi-local;
      exit 0;
      "
  mailpit:
    image: axllent/mailpit
    container_name: demano-kofi-mailpit
    volumes:
      - mailpit-data:/data
    ports:
      - 8025:8025
      - '${SMTP_PORT}:1025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1


volumes:
  pgdata:
  minio-data:
  mailpit-data: